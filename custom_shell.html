<!doctype html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<!-- PWA / Add to Home Screen -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Stunt Car Racer">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="theme-color" content="#000000">
	<link rel="manifest" href="manifest.json">
	<link rel="apple-touch-icon" href="icon-192.png">
	<title>Stunt Car Racer</title>
	<style>
		html, body {
			margin: 0;
			padding: 0;
			width: 100vw;
			height: 100vh;
			overflow: hidden;
			background: #000;
			-webkit-user-select: none;
			user-select: none;
			-webkit-touch-callout: none;
		}

		#canvas {
			padding: 0;
			width: 100vw;
			height: 100vh;
			display: block;
		}

		#textOverlay {
			position: absolute;
			left: 0;
			top: 0;
			pointer-events: none;
			width: 100%;
			height: 100%;
		}

		/* Landscape-only overlay: shown on mobile when in portrait */
		#rotateOverlay {
			display: none;
			position: fixed;
			left: 0; top: 0;
			width: 100%; height: 100%;
			background: #000;
			color: #fff;
			z-index: 10000;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			font-family: Arial, sans-serif;
			text-align: center;
		}
		#rotateOverlay .icon {
			font-size: 60px;
			margin-bottom: 20px;
			animation: rotateHint 2s ease-in-out infinite;
		}
		#rotateOverlay .msg {
			font-size: 20px;
		}
		@keyframes rotateHint {
			0%, 100% { transform: rotate(0deg); }
			50% { transform: rotate(90deg); }
		}

		/* PWA install button */
		#installBtn {
			display: none;
			position: fixed;
			bottom: 2vh;
			left: 50%;
			transform: translateX(-50%);
			z-index: 9999;
			padding: 10px 28px;
			background: rgba(255,255,255,0.9);
			color: #000;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-family: Arial, sans-serif;
			cursor: pointer;
			box-shadow: 0 2px 8px rgba(0,0,0,0.4);
		}

		/* On touch devices in portrait mode, show the rotate overlay and hide the game */
		@media (pointer: coarse) and (orientation: portrait) {
			#rotateOverlay {
				display: flex !important;
			}
			#canvas {
				visibility: hidden;
			}
			#touchControls {
				display: none !important;
			}
		}
	</style>
</head>

<body>
	<div id="rotateOverlay">
		<div class="icon">📱</div>
		<div class="msg">Please rotate your device to landscape mode</div>
	</div>

	<button id="installBtn">Install App</button>
	<canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>

	<script type='text/javascript'>
		// Make the window code in Substitutes/Window.cpp grab the window size at start-up
		window.production = true;

		// On iOS, the canvas doesn't properly resize after a portrait→landscape rotation.
		// If the page was loaded in portrait, reload once when we first enter landscape.
		(function() {
			var isLandscape = window.innerWidth > window.innerHeight;
			if (isLandscape) {
				// Started in landscape — mark it so we never reload
				sessionStorage.setItem('scr_was_landscape', '1');
			} else {
				// Started in portrait — watch for rotation to landscape
				function checkOrientation() {
					if (window.innerWidth > window.innerHeight) {
						if (!sessionStorage.getItem('scr_was_landscape')) {
							sessionStorage.setItem('scr_was_landscape', '1');
							window.location.reload();
						}
					}
				}
				window.addEventListener('resize', checkOrientation);
				window.addEventListener('orientationchange', function() {
					// Delay slightly — iOS reports stale dimensions during the event
					setTimeout(checkOrientation, 200);
				});
			}
		})();

		// Try to lock orientation to landscape (works on Android, not on iOS Safari)
		if (screen.orientation && screen.orientation.lock) {
			screen.orientation.lock('landscape').catch(function() {});
		}

		// Register service worker for offline/PWA support
		if ('serviceWorker' in navigator) {
			navigator.serviceWorker.register('sw.js').catch(function() {});
		}

		// PWA install prompt — capture the event and show an install button
		var deferredInstallPrompt = null;
		window.addEventListener('beforeinstallprompt', function(e) {
			e.preventDefault();
			deferredInstallPrompt = e;
			document.getElementById('installBtn').style.display = 'block';
		});
		document.getElementById('installBtn').addEventListener('click', function() {
			if (!deferredInstallPrompt) return;
			deferredInstallPrompt.prompt();
			deferredInstallPrompt.userChoice.then(function() {
				deferredInstallPrompt = null;
				document.getElementById('installBtn').style.display = 'none';
			});
		});
		// Hide button if app is installed
		window.addEventListener('appinstalled', function() {
			document.getElementById('installBtn').style.display = 'none';
			deferredInstallPrompt = null;
		});

		var Module = {
			preRun: [],
			postRun: [],
			print: (function () {
				return function (text) {
					if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
					console.log(text);
				};
			})(),
			printErr: function (text) {
				if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
				console.error(text);
			},
			canvas: (function () {
				var canvas = document.getElementById('canvas');

				// As a default initial behavior, pop up an alert when webgl context is lost. To make your
				// application robust, you may want to override this behavior before shipping!
				// See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
				canvas.addEventListener("webglcontextlost", function (e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);

				return canvas;
			})(),
		};
	</script>
	{{{ SCRIPT }}}
	<script src="game.js"></script>
</body>

</html>
